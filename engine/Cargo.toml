[package]
name = "pilot"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "PILOT FM MPX / RDS audio processor engine"
license = "UNLICENSED"
publish = false

[features]
default = ["alsa-out", "native-decoder"]
alsa-out = ["dep:alsa"]
native-decoder = ["dep:symphonia"]

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
rtrb = "0.3"
crossbeam-channel = "0.5"
ebur128 = "0.1"
rustfft = "6"
ureq = "2.10"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
alsa = { version = "0.9", optional = true }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3", "aac", "isomp4"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
